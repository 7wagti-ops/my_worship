name: Build & Analyze

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: 🏗️ Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: 'stable'
          cache: true
          
      - run: flutter pub get

      # فك تشفير المفتاح مع حذف أي مسافات أو أسطر جديدة
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > android/app/my-release-key.jks

      # إنشاء key.properties
      - name: Create key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > android/key.properties << PROPS
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=my-release-key.jks
          PROPS

      # التأكد من سلامة المفتاح
      - name: Verify Keystore
        run: keytool -list -v -keystore android/app/my-release-key.jks -storepass MyWorship2025

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: etizan-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
